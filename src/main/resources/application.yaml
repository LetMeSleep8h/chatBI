spring:
  application:
    name: chatBI
  datasource:
    # 本机默认 localhost:3306；容器部署通过 MYSQL_HOST/MYSQL_PORT 环境变量覆盖
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/data_platform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      # 启动自动执行 schema.sql（建表语句 IF NOT EXISTS，可重复执行）
      mode: always
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB

server:
  port: 8090

zhipu:
  api-key: ${ZHIPU_API_KEY}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

# 数据采集平台 JWT 签名密钥，从环境变量读取
jwt:
  secret: ${JWT_SECRET:change-me-in-production-please-use-a-long-random-string-at-least-32-bytes}
  expire-hours: 24

upload:
  dir: ./uploads
