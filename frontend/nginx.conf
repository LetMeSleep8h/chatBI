server {
    listen 80;
    # 数据上传最大 50MB + 余量
    client_max_body_size 60m;

    # ---- 后端 API（Spring Boot 8090）----
    location /bi/ {
        proxy_pass http://backend:8090;
    }
    location /auth/ {
        proxy_pass http://backend:8090;
    }
    location = /tasks {
        proxy_pass http://backend:8090;
    }
    location ~ ^/tasks/\d+$ {
        proxy_pass http://backend:8090;
    }
    location ~ ^/tasks/\d+/assign$ {
        proxy_pass http://backend:8090;
    }
    location = /records {
        proxy_pass http://backend:8090;
    }
    location = /records/mine {
        proxy_pass http://backend:8090;
    }
    location ~ ^/records/\d+/review$ {
        proxy_pass http://backend:8090;
    }

    # ---- 前端 SPA ----
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
