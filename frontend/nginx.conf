server {
    listen 80;
    # 数据上传最大 50MB + 余量
    client_max_body_size 60m;

    # ---- 采集平台 API（宿主机剥 /bi 前缀后到达）----
    location /auth/ { proxy_pass http://backend:8090; }
    location = /tasks { proxy_pass http://backend:8090; }
    location ~ ^/tasks/\d+$ { proxy_pass http://backend:8090; }
    location ~ ^/tasks/\d+/assign$ { proxy_pass http://backend:8090; }
    location ~ ^/tasks/\d+/deliver$ { proxy_pass http://backend:8090; }
    location = /stats { proxy_pass http://backend:8090; }
    location = /records { proxy_pass http://backend:8090; }
    location = /records/mine { proxy_pass http://backend:8090; }
    location ~ ^/records/\d+/review$ { proxy_pass http://backend:8090; }
    location ~ ^/records/\d+/download$ { proxy_pass http://backend:8090; }
    location /devices { proxy_pass http://backend:8090; }

    # ---- 直连 5160 时带 /bi 站点前缀的 API：剥掉 /bi 再转后端 ----
    location ~ ^/bi/(auth|tasks|records|devices|stats)(/|$) {
        rewrite ^/bi(/.*)$ $1 break;
        proxy_pass http://backend:8090;
    }

    # ---- 前端静态资源与 SPA（挂 /bi 前缀）----
    location /bi/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /bi/index.html;
    }
    location / {
        root /usr/share/nginx/html;
        try_files $uri /bi/index.html;
    }
}
