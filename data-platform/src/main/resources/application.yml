server:
  port: 8081

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/data_platform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      # 启动时自动执行 schema.sql（建表语句全部 IF NOT EXISTS，可重复执行）
      mode: always
  servlet:
    multipart:
      # 上传限制 50MB；业务层再显式校验并返回 413
      max-file-size: 50MB
      max-request-size: 55MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false

# JWT 签名密钥（HMAC-SHA256），从环境变量读取，不硬编码
jwt:
  secret: ${JWT_SECRET:change-me-in-production-please-use-a-long-random-string-at-least-32-bytes}
  expire-hours: 24

springdoc:
  swagger-ui:
    path: /doc.html

# 上传文件保存目录
upload:
  dir: ./uploads
