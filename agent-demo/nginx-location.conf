# =====================================================================
# 具身智能数据采集平台（agent-demo）nginx 片段 —— 供人工粘贴到服务器
# nginx 的 server{} 块内。本文件只是文本模板，AI 不会直接修改服务器配置。
#
# 应用是单容器（FastAPI 同时托管 API 与前端静态文件），内部前缀固定为
# /agent。想让域名对外用 /x/ 路径，用下面两个 location 组合：
#   - /x/    对外页面入口，重写为 /agent/ 转给容器
#   - /agent/  应用内部的资源/API 引用（/agent/assets、/agent/api），原样透传
# 上传文件上限 50MB，务必放开 body 大小。
# =====================================================================

# 对外入口：https://sleep8h.tech/x/...
location /x/ {
    rewrite ^/x(/.*)$ $1 break;
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 60m;   # 数据上传 ≤50MB + 余量
    proxy_read_timeout 120s;
}

# 应用内部引用（资源 /agent/assets、接口 /agent/api）原样透传
location /agent/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 60m;
}
